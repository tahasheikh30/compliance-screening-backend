services:
  - type: web
    name: account-screening-backend
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ALLOWED_ORIGINS
        value: "https://your-frontend.vercel.app"
      - key: API_KEY
        generateValue: true   # Render will generate and store a random secret
      - key: STORAGE_DIR
        value: "/opt/render/project/src/data"   # must match disk.mountPath below exactly
    disk:
      name: screening-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

# The sanctions lists are downloaded live from their publishers on each
# screening (and kept in memory for LIST_CACHE_TTL_SECONDS), so the disk only
# holds the SQLite history DB and the evidence PDFs.
#
# IMPORTANT: attaching a disk only mounts a filesystem path. The STORAGE_DIR env
# var above is what tells the app to use it (see app/config.py). If you rename
# the disk's mountPath, update STORAGE_DIR to match, or the app will keep writing
# inside the container and lose its data on the next redeploy.
#
# Free tier: set `plan: free`, delete the `disk:` block and the STORAGE_DIR line.
# History and evidence PDFs are then lost on every restart, and the service
# sleeps when idle, so the first screening after a sleep also re-downloads the lists.
