services:
  - type: web
    name: compliance-screening-backend
    runtime: python
    plan: free          # no disk is needed: everything is stored in Supabase
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-server-header --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: "https://your-frontend.vercel.app"
      - key: SUPABASE_URL
        value: "https://qtghepgrcksmkxrzydjc.supabase.co"
      - key: DATABASE_URL
        sync: false     # secret: the Supabase "Session pooler" connection string, set in the Render dashboard
      - key: SUPABASE_JWT_SECRET
        sync: false     # only if the project still signs tokens with the legacy secret; otherwise leave empty
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false     # SECRET, optional: lets admins delete a person's sign in account (People tab). Without it Delete is refused; Disable still works
      - key: APP_API_KEY
        sync: false     # the key the frontend sends (VITE_API_KEY on Vercel must be the same value); not a secret
      - key: API_KEY
        generateValue: true   # SECRET machine credential for the scheduled NACTA upload only; never give it to the frontend

# Nothing is kept on the server's disk. Users, screening history, evidence PDFs and the NACTA list are
# all in the Supabase database, so restarts, redeploys and the free plan's sleep lose nothing.
# The sanctions lists are downloaded live on each screening (and kept in memory for LIST_CACHE_TTL_SECONDS).
