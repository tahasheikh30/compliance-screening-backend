services:
  - type: web
    name: account-screening-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ALLOWED_ORIGINS
        value: "https://your-frontend.vercel.app"
      # - key: ADVERSE_MEDIA_API_KEY
      #   value: "set this in the Render dashboard, not here, if you go with a vendor"
    disk:
      name: screening-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1